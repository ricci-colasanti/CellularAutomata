<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Game of Life</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;            /* no scrollbars */
      background: #eeeeee;
    }

    #testCanvas {
      display: block;
      width: 100vw;
      height: 100vh;
      background: #eeeeee;
      image-rendering: pixelated;  /* keep cells crisp when scaled */
    }
  </style>
</head>

<body>
  <canvas id="testCanvas"></canvas>

  <script type="module">
    document.addEventListener("DOMContentLoaded", () => {
      const canvas = document.getElementById("testCanvas");

      // OffscreenCanvas: the worker owns the drawing buffer.
      const offscreen = canvas.transferControlToOffscreen();
      const worker = new Worker("gol_worker.js", { type: "module" });

      worker.onerror = (err) => {
        console.error("Worker error:", err.message, err.filename, err.lineno);
      };

      // The worker tells us the real buffer size; match CSS to it so
      // the browser doesn't stretch the buffer across a different shape.
      worker.onmessage = (e) => {
        if (e.data.type === "sizeChanged") {
          canvas.style.width  = e.data.width  + "px";
          canvas.style.height = e.data.height + "px";
        }
      };

      // Read the CSS size (not window size!) and tell the worker.
      const rect = canvas.getBoundingClientRect();

      worker.postMessage({
        type: "initCanvas",
        canvas: offscreen,
        desiredWidth:  Math.round(rect.width),
        desiredHeight: Math.round(rect.height),
        yCells: 111,
      }, [offscreen]);

      worker.postMessage({ type: "start" });

      // On real resizes, ask the worker to refit.
      window.addEventListener("resize", () => {
        const r = canvas.getBoundingClientRect();
        worker.postMessage({
          type: "resize",
          width:  Math.round(r.width),
          height: Math.round(r.height),
        });
      });
    });
  </script>
</body>
</html>
