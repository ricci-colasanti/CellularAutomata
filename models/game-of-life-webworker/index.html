<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simple Template</title>
  <style>

    body {
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, sans-serif;
      line-height: 1.6;
    }


    canvas {
      display: block;
      width: 100%;
      height: auto;
      min-height: 300px;
    }


  </style>
</head>

<body>


    <canvas id="testCanvas"></canvas>


<script>
// Wait for DOM to be fully loaded before accessing canvas
document.addEventListener('DOMContentLoaded', () => {
  const canvas = document.getElementById("testCanvas");
  
  // Set canvas dimensions AFTER it's in the layout
  function resizeCanvas() {
    const rect = canvas.getBoundingClientRect();
    canvas.width = rect.width || 1000;
    canvas.height = rect.height || 300;
    
    // Re-initialize worker with new dimensions if needed
    if (window.golWorkerInitialized) {
      window.golWorker.postMessage({ 
        type: "resize", 
        width: canvas.width, 
        height: canvas.height 
      });
    }
  }

  // Initial sizing
  resizeCanvas();

  // Listen for window resize events
  window.addEventListener('resize', resizeCanvas);

  const offscreen = canvas.transferControlToOffscreen();
  const worker = new Worker("gol_worker.js", { type: "module" });

  worker.onerror = (err) => {
    console.error("Worker error:", err.message, err.filename, err.lineno);
  };

  worker.postMessage({ type: "initCanvas", canvas: offscreen }, [offscreen]);
  worker.postMessage({ type: "start" });

  // Mark worker as initialized
  window.golWorkerInitialized = true;
  window.golWorker = worker;
});
</script>
</body>
</html>
