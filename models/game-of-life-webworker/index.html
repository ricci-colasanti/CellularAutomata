<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simple Template</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, sans-serif;
      line-height: 1.6;
    }

    .container {
      max-width: 960px;
      margin: 0 auto;
      padding: 20px;
      background-color: #fdfdfd;
    }

    pre {
      background: #f4f4f4;
      padding: 12px;
      overflow-x: auto;
      border-radius: 4px;
    }

    code {
      font-family: ui-monospace, SFMono-Regular, monospace;
    }

    a {
      text-decoration: none;
    }

    .full_screen_canvas {
      width: 100vw;
      height: 100vh;
      display: block;
    }

    .windowed_canvas {
      /* This is the *desired* size. The worker will shrink it to fit
         an integer grid. Leave it here as a starting hint. */
      width: 700px;
      height: 400px;
      display: block;
      background: #eee;
        margin: 0 auto;
    }
  </style>
</head>

<body>
  <div class="container">
    <canvas class="windowed_canvas" id="testCanvas"></canvas>
  </div>

  <script type="module">
    document.addEventListener("DOMContentLoaded", () => {
      const canvas = document.getElementById("testCanvas");

      // OffscreenCanvas: the worker owns the drawing buffer.
      const offscreen = canvas.transferControlToOffscreen();
      const worker = new Worker("gol_worker.js", { type: "module" });

      worker.onerror = (err) => {
        console.error("Worker error:", err.message, err.filename, err.lineno);
      };

      // The worker tells us the real buffer size; we match CSS to it so
      // the browser doesn't stretch the buffer across a different shape.
      worker.onmessage = (e) => {
        if (e.data.type === "sizeChanged") {
          canvas.style.width  = e.data.width  + "px";
          canvas.style.height = e.data.height + "px";
        }
      };

      // Read the CSS size (not window size!) and tell the worker.
      const rect = canvas.getBoundingClientRect();

      worker.postMessage({
        type: "initCanvas",
        canvas: offscreen,
        desiredWidth:  Math.round(rect.width),
        desiredHeight: Math.round(rect.height),
        yCells: 111,
      }, [offscreen]);

      worker.postMessage({ type: "start" });

      // On real resizes, ask the worker to refit.
      // (For a fixed-size "windowed" canvas you can skip this, but it's
      //  harmless and useful for the full-screen variant.)
      window.addEventListener("resize", () => {
        const r = canvas.getBoundingClientRect();
        worker.postMessage({
          type: "resize",
          width:  Math.round(r.width),
          height: Math.round(r.height),
        });
      });
    });
  </script>
</body>
</html>
